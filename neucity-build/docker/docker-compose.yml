services:
  # 开发环境配置
  neucity:
    build:
      context: .
      dockerfile: Dockerfile
    image: neucity-build
    container_name: neucity-build
    ports:
      - "6006:6006"
    environment:
      - JAVA_OPTS=-Xmx1024m -Xms512m -Dfile.encoding=utf-8
    volumes:
      # 日志
      - ./logs:/app/logs/neucity-build:rw
      # 配置文件目录
      - ./config:/app/config:rw
      # 数据文件目录
      - /home/file:/app/data/file:rw
      - /data/neucity/drives:/app/data/drives:rw
      - ./neucity-build.jar:/app/neucity-build.jar:rw
    networks:
      - neucity-network
    restart: unless-stopped

networks:
  neucity-network:
    name: neucity-network